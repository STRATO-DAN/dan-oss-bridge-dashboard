name: Publish

# Publishes to npm on a GitHub Release being published (a deliberate, human-triggered action — never
# on every push/tag). Runs entirely on GitHub's infrastructure: no dependency on any one machine
# (Spark or otherwise) being reachable. Uses npm provenance so the published package is cryptographically
# tied to this exact workflow run/commit — a stronger supply-chain guarantee than a manual publish from
# any developer machine.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
