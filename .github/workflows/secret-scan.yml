name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN: these workflows only read the repo (checkout + test/scan).
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (free, no API key needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action requires a paid GITLEAKS_LICENSE for org-owned repos.
      # The gitleaks CLI itself is free and MIT-licensed, so we install and run the binary
      # directly — genuinely "no API key needed", no org license, no external action.
      - name: Install gitleaks (free MIT binary)
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          chmod +x gitleaks
      - name: Scan for secrets
        run: ./gitleaks detect --source . --redact --no-banner

  gitguardian:
    name: GitGuardian ggshield
    runs-on: ubuntu-latest
    # Requires a real GITGUARDIAN_API_KEY repo secret (Settings → Secrets and variables →
    # Actions) before this job can actually scan — not provisioned yet, so this job is expected
    # to fail/skip until that secret is added. gitleaks above is the real, immediately-working
    # backstop in the meantime; this job isn't a soft no-op, it's an honest "needs setup" gate.
    if: ${{ vars.GITGUARDIAN_CONFIGURED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
